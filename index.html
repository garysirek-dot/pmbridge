<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>PMBridge</title>
<meta name="description" content="PMBridge: project cards with tasks, schedules, quick-add dates and a month calendar.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="PMBridge">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=3">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<style>
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* PMBridge: same look as Canvas and MYCAL. Black page, charcoal rounded cards, colored underlined titles. */
:root {
  --bg: #000000;
  --card: #2a2a2c;
  --card-edge: #38383b;
  --ink: #ececee;
  --dim: #8e8e93;
  --faint: #56565a;
  --pop: #1c1c1e;
  --danger: #ff6b6b;
  --accent: #3CB371;
  --font: "Aptos Display", "Aptos", "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font); font-size: 15px; min-height: 100vh; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [contenteditable]:focus-visible, input:focus-visible { outline: 2px solid #5aa9ff; outline-offset: 2px; border-radius: 4px; }
input, textarea, select { font: inherit; color: inherit; }

/* ---------- header (same as Canvas / MYCAL) ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 1000;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 14px 20px; background: rgba(0,0,0,.86); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; flex: none; cursor: pointer; }
.brand-icon { height: 60px; width: auto; flex: none; display: block; }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-name { font-weight: 700; font-size: 24px; letter-spacing: .08em; }
.brand-sub { font-style: italic; font-size: 16px; letter-spacing: .03em; color: var(--dim); margin-top: 3px; }
.tabs { display: flex; gap: 4px; padding: 4px; background: #141415; border: 1px solid var(--card-edge); border-radius: 12px; margin-right: auto; }
.tab { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 8px; color: var(--dim); font-size: 14px; font-weight: 600; letter-spacing: .02em; transition: background .15s, color .15s; }
.tab svg { width: 17px; height: 17px; flex: none; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 0 rgba(255,255,255,.04) inset; }
.top-right { display: flex; align-items: center; gap: 12px; margin-left: auto; min-width: 0; }
.brand-tag { color: var(--dim); font-size: 13.5px; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; margin-right: 6px; }
.round-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--card); border: 1px solid var(--card-edge); display: grid; place-items: center; flex: none; transition: background .15s, transform .15s; }
.round-btn:hover, .round-btn.open { background: #3a3a3d; }
.round-btn:active { transform: scale(.94); }
.round-btn svg { width: 20px; height: 20px; }
@media (max-width: 1199px) { .brand-tag { display: none; } }

/* add menu (Canvas) */
.add-menu { position: fixed; z-index: 30000; width: 270px; padding: 6px; background: var(--pop); border: 1px solid var(--card-edge); border-radius: 12px; box-shadow: 0 16px 36px rgba(0,0,0,.65); display: flex; flex-direction: column; gap: 2px; }
.add-menu button { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; text-align: left; }
.add-menu button:hover, .add-menu button:focus-visible { background: rgba(255,255,255,.07); outline: none; }
.add-menu strong { display: block; font-size: 15px; }
.add-menu small { display: block; font-size: 12px; color: var(--dim); margin-top: 1px; }
.am-icon { width: 34px; height: 34px; flex: none; border-radius: 9px; background: var(--card); border: 1px solid var(--card-edge); display: grid; place-items: center; }
.am-icon svg { width: 19px; height: 19px; }
.am-sep { border: 0; border-top: 1px solid var(--card-edge); margin: 4px 6px; }

/* ---------- cards ---------- */
.card { position: relative; background: var(--card); border: 1px solid var(--card-edge); border-radius: 10px; padding: 14px 16px 12px 20px; box-shadow: 0 6px 20px rgba(0,0,0,.5); min-width: 0; }
.card-head { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 3px solid currentColor; }
.title { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; letter-spacing: .05em; text-transform: uppercase; line-height: 1.3; overflow-wrap: anywhere; padding-top: 2px; }
.title[contenteditable="true"] { cursor: text; outline: none; }
.head-btn { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; flex: none; color: var(--dim); }
.head-btn:hover { background: rgba(255,255,255,.08); color: var(--ink); }
.head-btn svg { width: 18px; height: 18px; transition: transform .2s; }
.edit-btn { width: auto; height: 24px; padding: 0 7px; border: 1.5px solid currentColor; border-radius: 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .12em; color: inherit; }
.edit-btn:hover { color: inherit; background: color-mix(in srgb, currentColor 14%, transparent); }
.card.collapsed .card-head { border-bottom-color: transparent; padding-bottom: 0; }
.card.collapsed .toggle svg { transform: rotate(-90deg); }
.card.collapsed .card-body { display: none; }
.sched-meta { margin-top: 8px; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.add-task { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 4px 0; color: var(--dim); font-size: 14px; }
.add-task:hover { color: var(--ink); }
.add-task svg { width: 18px; height: 18px; }

/* ---------- home: project squares ---------- */
.home { padding: 6px 20px 60px; }
.home-head { display: flex; align-items: baseline; gap: 10px; margin: 6px 2px 14px; }
.home-head h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.home-head span { color: var(--dim); font-size: 13px; font-weight: 600; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
.ptile { aspect-ratio: 1; display: flex; flex-direction: column; border-radius: 14px; cursor: pointer; transition: transform .15s, border-color .15s; overflow: hidden; }
.ptile:hover { border-color: #4a4a4e; }
.ptile:active { transform: scale(.985); }
.ptile .card-head { align-items: flex-start; }
.ptile .title { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.p-subs { flex: 1; min-height: 0; list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
.p-subs li { display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink); min-width: 0; }
.p-subs li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.p-subs li:not(.more-subs) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; padding-left: 16px; position: relative; }
.p-subs li:not(.more-subs)::before { position: absolute; left: 0; top: 50%; transform: translateY(-50%); }
.p-subs li { flex: none; }
.p-subs .more-subs { color: var(--dim); font-weight: 600; text-transform: none; letter-spacing: 0; }
.p-subs .more-subs::before { display: none; }
.p-prog { display: flex; align-items: center; gap: 10px; }
.p-prog .bar { flex: 1; }
.p-prog span { font-size: 12px; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.p-prog b { color: var(--ink); font-weight: 600; }
.p-desc { flex: 1; min-height: 0; margin-top: 10px; font-size: 14px; line-height: 1.45; color: var(--ink); opacity: .88; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 7; }
.p-desc.empty { color: var(--faint); font-style: italic; opacity: 1; }
.p-foot { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.p-meta { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; display: flex; gap: 6px; flex-wrap: wrap; }
.p-meta b { color: var(--ink); font-weight: 600; }
.p-next { font-size: 12.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-next .np { display: inline-block; padding: 1px 6px; margin-right: 6px; border-radius: 6px; border: 2px solid var(--c); color: var(--c); font-weight: 700; font-size: 11px; letter-spacing: .05em; }
.bar { height: 6px; border-radius: 3px; background: #1c1c1e; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); border-radius: 3px; transition: width .3s; }
.new-tile { aspect-ratio: 1; border: 2px dashed var(--card-edge); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--dim); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 14px; transition: border-color .15s, color .15s; }
.new-tile:hover { border-color: var(--accent); color: var(--ink); }
.new-tile .ni { width: 48px; height: 48px; border-radius: 50%; background: var(--card); border: 1px solid var(--card-edge); display: grid; place-items: center; color: var(--accent); }
.new-tile .ni svg { width: 24px; height: 24px; }
.home-empty { color: var(--dim); max-width: 46ch; line-height: 1.5; margin: 0 2px 18px; }

/* ---------- project view ---------- */
.crumb { display: flex; align-items: center; gap: 6px; padding: 2px 20px 10px; }
.crumb button { display: inline-flex; align-items: center; gap: 4px; color: var(--dim); font-size: 12.5px; font-weight: 700; letter-spacing: .1em; padding: 6px 8px 6px 2px; border-radius: 7px; }
.crumb button:hover { color: var(--ink); }
.crumb svg { width: 16px; height: 16px; }
.pv { display: grid; gap: 20px 24px; align-items: start; padding: 0 20px 60px; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); grid-template-areas: "main cal"; }
/* campus page: one card-width column per project */
.pcols { display: grid; grid-template-columns: repeat(auto-fill, 450px); gap: 24px; align-items: start; justify-content: start; padding: 0 20px 60px; }
.pcols .psec { min-width: 0; }
.pcols .psec > .col { gap: 16px; }
.add-col { margin-top: 38px; min-height: 180px; border: 2px dashed var(--card-edge); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--dim); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; transition: border-color .15s, color .15s; }
.add-col:hover { border-color: var(--c, var(--accent)); color: var(--ink); }
.add-col .ni { width: 44px; height: 44px; border-radius: 50%; background: var(--card); border: 1px solid var(--card-edge); display: grid; place-items: center; color: var(--c, var(--accent)); }
.add-col .ni svg { width: 22px; height: 22px; }
.xcard .sched-empty { margin: 10px 0 2px; }
/* main page overview cards */
.ov-sec { margin-top: 40px; }
.ov-tile { cursor: pointer; }
.tile-stats { flex: 1; display: flex; gap: 22px; margin-top: 16px; align-items: flex-start; flex-wrap: wrap; }
.tile-stats > div { display: flex; flex-direction: column; min-width: 0; }
.tile-stats b { font-size: 42px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); }
.tile-stats span { font-size: 11.5px; color: var(--dim); margin-top: 7px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; }
.tile-stats .red b { color: #FF5A5A; }
.tile-sub { font-size: 12.5px; color: var(--dim); }
.tile-go { font-size: 12.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
.page-body { padding: 0 20px 60px; }
.page-body .st-sec { margin-top: 0; }
.pv-main { grid-area: main; display: flex; flex-direction: column; gap: 32px; min-width: 0; }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.col-cal { grid-area: cal; position: sticky; top: 96px; }
/* each project in a campus: task card(s) | critical path + blockers */
.psec-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px 24px; align-items: start; }
.psec-head { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; padding: 1px 0 1px 12px; border-left: 4px solid var(--c); }
.psec-title { flex: 1; min-width: 0; font-weight: 800; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); outline: none; overflow-wrap: anywhere; }
.psec-title[contenteditable="true"] { cursor: text; }
.psec-head .edit-btn { color: var(--c); }
.add-proj { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border: 2px dashed var(--card-edge); border-radius: 12px; color: var(--dim); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; transition: border-color .15s, color .15s; }
.add-proj:hover { border-color: var(--c, var(--accent)); color: var(--ink); }
.add-proj svg { width: 18px; height: 18px; }
@media (max-width: 1279px) { .pv { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .psec-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 999px) { .pv { grid-template-columns: minmax(0, 1fr); grid-template-areas: "main" "cal"; } .col-cal { position: static; } }
/* status table on the main screen */
.st-sec { margin-top: 40px; }
.st-sec .home-head { flex-wrap: wrap; row-gap: 8px; align-items: center; }
.st-card { padding: 0; overflow: hidden; }
/* star: sends a task to the Status table */
.star-btn { width: 22px; height: 22px; display: none; place-items: center; color: var(--faint); flex: none; border-radius: 6px; }
.star-btn svg { width: 15px; height: 15px; }
.item.starred .star-btn, .item:hover .star-btn, .item:focus-within .star-btn, .item.editing .star-btn { display: grid; }
.item.starred .star-btn { color: #FFD84D; }
.star-btn:hover { color: #FFD84D; background: rgba(255,255,255,.07); }
.st-star { display: inline-grid; place-items: center; width: 20px; height: 20px; margin: 0 4px 0 -2px; vertical-align: -4px; color: var(--faint); border-radius: 5px; }
.st-star svg { width: 14px; height: 14px; }
.st-star.on { color: #FFD84D; }
.st-star:hover { color: #FFD84D; background: rgba(255,255,255,.07); }
.st-seg { margin-left: auto; }
.st-sec .home-head .st-seg button { padding: 5px 11px; font-size: 12.5px; color: var(--dim); }
.st-sec .home-head .st-seg button[aria-pressed="true"] { background: #3a3a3d; color: var(--ink); }
.st-card .st-seg button { padding: 4px 10px; font-size: 12px; color: var(--dim); }
.st-card .st-seg button[aria-pressed="true"] { background: #3a3a3d; color: var(--ink); }
.st-wrap { overflow-x: auto; }
table.st { width: 100%; border-collapse: collapse; min-width: 860px; font-size: 14px; table-layout: fixed; }
.st th { text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); padding: 10px 12px; border-bottom: 1px solid var(--card-edge); white-space: nowrap; }
.st th:nth-child(1) { width: 15%; } .st th:nth-child(2) { width: 14%; } .st th:nth-child(3) { width: 24%; } .st th:nth-child(4) { width: 22%; } .st th:nth-child(5) { width: 15%; } .st th:nth-child(6) { width: 10%; }
.st th:first-child, .st td:first-child { padding-left: 20px; }
.st td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.05); vertical-align: top; line-height: 1.4; overflow-wrap: anywhere; }
.st tbody tr:last-child td { border-bottom: 0; }
.st tbody tr:hover td { background: rgba(255,255,255,.025); }
.st-camp { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 12.5px; color: var(--ink); }
.st-camp i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.st-proj { font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); }
.st-item { text-align: left; font-weight: 600; color: var(--ink); line-height: 1.4; }
.st-item:hover { text-decoration: underline; text-underline-offset: 3px; }
.st-item .np { display: inline-block; padding: 0 5px; margin-right: 6px; border-radius: 5px; border: 1.5px solid var(--c); color: var(--c); font-size: 10.5px; font-weight: 800; letter-spacing: .05em; vertical-align: 1px; }
.st-edit { min-height: 22px; outline: none; border-radius: 6px; padding: 2px 6px; margin: -2px -6px; cursor: text; }
.st-edit:hover { background: rgba(255,255,255,.04); }
.st-edit:focus { background: #232325; box-shadow: 0 0 0 1px var(--card-edge); }
.st-edit:empty::before { content: attr(data-ph); color: var(--faint); }
.st-blk { display: flex; gap: 8px; align-items: flex-start; }
.st-blk i { width: 10px; height: 10px; border-radius: 50%; background: #FF5A5A; flex: none; margin-top: 6px; }
.st-blk .st-edit { flex: 1; min-width: 0; color: #ffb3b3; }
.st-none { color: var(--faint); }
.st .st-empty { color: var(--dim); padding: 16px 20px; }
@media (max-width: 699px) { .st-edit { font-size: 16px; } .st-sec { margin-top: 30px; } }
/* project header (title only; the description lives on the Projects tab) */
.proj-head { display: flex; align-items: center; gap: 14px; padding: 2px 20px 16px; }
.ph-main { flex: 1; min-width: 0; }
.ph-crumb { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); cursor: pointer; }
.ph-crumb:hover { color: var(--ink); }
.ph-title { margin: 2px 0 0; font-size: 22px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; line-height: 1.2; overflow-wrap: anywhere; }
.ph-stats { width: 220px; flex: none; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
/* dates on task lines */
.item .date-pill { min-width: 50px; padding: 1px 5px; font-size: 11px; margin-top: 0; }
.item .date-pill.no-date { opacity: .45; }
.item:hover .date-pill.no-date, .item:focus-within .date-pill.no-date { opacity: 1; }
.card.no-dates .item .date-pill { display: none; }
.item .row-open { width: 22px; height: 22px; opacity: .35; transition: opacity .12s; }
.item:hover .row-open, .item:focus-within .row-open, .item .row-open.has { opacity: 1; }
@media (hover: none) { .item .row-open { opacity: .7; } }
.text[contenteditable="false"], .ms-text[contenteditable="false"] { cursor: pointer; -webkit-user-select: none; user-select: none; }
/* bigger tap targets on touch screens */
@media (pointer: coarse) {
  .check { position: relative; z-index: 2; }
  .check::after { content: ""; position: absolute; inset: -11px -7px -11px -5px; }
  .item .row-open, .srow .row-open { position: relative; }
  .item .row-open::after, .srow .row-open::after { content: ""; position: absolute; inset: -9px -6px; }
  .grip { z-index: 1; }
}
.item.fresh { animation: freshRow 1.6s ease; }
.sched-card .items.srows { margin-left: 0; }
/* computers: the quarter-width cards put owner (and status) on a second line so names stay readable */
.task-card, .sched-card, .blk-card { container-type: inline-size; container-name: card; }
/* blockers */
.blk-card .items.srows { margin-left: 0; }
.blk-card .brow .ms-text { color: var(--ink); }
.item .blk-btn { margin-top: -1px; }
.blk-btn { width: 24px; height: 24px; }
.blk-btn .s-dot { width: 10px; height: 10px; }
.blk-btn.s-ns { background: transparent; border-color: var(--card-edge); }
.blk-btn.s-ns .s-dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
.blk-btn.s-blk { background: color-mix(in srgb, #FF5A5A 28%, transparent); border-color: #FF5A5A; }
.item.blocked .text { color: color-mix(in srgb, #FF5A5A 30%, var(--ink)); }
.ev-blk { margin-top: 8px; }
@media (min-width: 1000px) {
  @container card (max-width: 400px) {
    .item:not(.phase) { flex-wrap: wrap; row-gap: 0; }
    .item .text, .srow .ms-text { overflow-wrap: break-word; word-break: normal; hyphens: auto; }
    .item:not(.phase) .bic { order: 6; flex: 0 0 100%; width: auto; margin: 0; padding-left: 48px; font-size: 12px; }
    .item.editing:not(.sub) .bic { padding-left: 108px; }
    .item.sub .bic { padding-left: 40px; }
    .card.no-dates .item:not(.sub) .bic { padding-left: 48px; }
    .item:not(.phase):not(:focus-within):not(.editing) .bic:has(.bic-text:empty) { display: none; }
    .item:not(:focus-within):hover .indent { display: none; }
    .sched-card .srow { flex-wrap: wrap; row-gap: 1px; }

  }
}
/* owner on task lines */
.item .bic { width: 74px; margin-top: 1px; }

/* quick add (MYCAL) */

.qa-go { width: 34px; height: 34px; border-radius: 8px; background: var(--c); color: #000; display: grid; place-items: center; flex: none; }

@keyframes flash { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }

/* task rows (Canvas) */
.items { list-style: none; margin: 10px 0 0 -20px; padding: 0; display: flex; flex-direction: column; gap: 4px; position: relative; }
.item { display: flex; align-items: flex-start; gap: 10px; padding: 3px 0; position: relative; -webkit-touch-callout: none; transition: opacity .2s; }
.item.sub { padding-left: 44px; gap: 8px; }
.grip { flex: none; width: 22px; height: 24px; margin-right: -12px; margin-top: -2px; display: grid; place-items: center; color: var(--dim); cursor: grab; touch-action: none; opacity: .45; transition: opacity .12s; }
.item.sub .grip { margin-right: -10px; }
.grip svg { width: 10px; height: 14px; }
.item:hover .grip, .item:focus-within .grip, .srow:hover .grip, .srow:focus-within .grip { opacity: .8; }
.grip:hover { opacity: 1 !important; color: var(--ink); }
.lifting { z-index: 30; background: #333336; border-radius: 6px; box-shadow: 0 8px 18px rgba(0,0,0,.55); pointer-events: none; }
.drop-line { position: absolute; left: 16px; right: 0; height: 3px; border-radius: 2px; background: var(--list-color); pointer-events: none; z-index: 2; }
body.row-drag, body.row-drag * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
.check { flex: none; width: 18px; height: 18px; margin-top: 1px; border-radius: 5px; border: 2px solid var(--dim); display: grid; place-items: center; transition: background .12s, border-color .12s; }
.item.sub .check { width: 14px; height: 14px; border-radius: 4px; margin-top: 3px; border-width: 1.75px; }
.check svg { width: 12px; height: 12px; opacity: 0; }
.item.sub .check svg { width: 9px; height: 9px; }
.item.done .check, .srow.done .check { background: var(--list-color); border-color: var(--list-color); }
.item.done .check svg, .srow.done .check svg { opacity: 1; }
.bang { display: none; font-weight: 800; font-size: 12px; line-height: 1; color: var(--list-color); font-style: normal; }
.item.important:not(.done) .check { border-color: var(--list-color); }

.item.important:not(.done) .bang { display: block; }

.item.important:not(.done) .text { font-weight: 700; color: var(--list-color); }
.text { flex: 1; min-width: 0; line-height: 1.35; outline: none; overflow-wrap: anywhere; cursor: text; }
.text:empty::before { content: "Task"; color: var(--faint); }
.item.sub .text { font-size: 14px; font-style: italic; }
.item.done { opacity: .5; }
.item.done .text { text-decoration: line-through; text-decoration-color: var(--dim); text-decoration-thickness: 1.5px; }
.indent { flex: none; width: 24px; height: 22px; border-radius: 5px; color: var(--dim); display: none; place-items: center; font-weight: 800; font-size: 14px; }
.indent svg { width: 15px; height: 15px; }
.item:focus-within .indent, .item:hover .indent { display: grid; }
/* phases: fixed, bold headings in the card color */
.task-card .item:not(.editing) .date-pill { display: none; }
.item.phase { align-items: center; padding: 12px 0 5px 0; margin: 0 0 2px 20px; }
.item.phase:first-child { padding-top: 4px; }
.phase-text { flex: 1; min-width: 0; font-weight: 800; font-size: 15px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink); line-height: 1.35; outline: none; overflow-wrap: anywhere; cursor: text; }
.phase-text:empty::before { content: attr(data-ph); color: var(--faint); font-weight: 700; }
.phase-x { width: 24px; height: 24px; border-radius: 6px; color: var(--faint); font-size: 18px; line-height: 1; flex: none; opacity: 0; transition: opacity .12s; }
.item.phase:hover .phase-x, .item.phase:focus-within .phase-x { opacity: 1; }
.phase-x:hover { color: var(--danger); background: rgba(255,255,255,.07); }
@media (hover: none) { .phase-x { opacity: .6; } }
.add-btns { display: flex; flex-wrap: wrap; gap: 4px 22px; }
.item.sub .text { color: var(--ink); }
.indent:hover { background: rgba(255,255,255,.08); color: var(--ink); }

/* schedule rows (Canvas) */
.items.srows { gap: 2px; margin-left: -16px; }
.srow { display: flex; align-items: center; flex-wrap: nowrap; gap: 6px; padding: 5px 0; position: relative; border-bottom: 1px solid rgba(255,255,255,.05); }

.date-pill { flex: none; min-width: 54px; padding: 3px 6px; border-radius: 7px; border: 2px solid var(--c, var(--list-color)); color: var(--c, var(--list-color)); font-weight: 700; font-size: 12px; letter-spacing: .05em; text-align: center; font-variant-numeric: tabular-nums; line-height: 1.2; }

.ms-text { flex: 1 1 auto; min-width: 0; font-size: 14.5px; line-height: 1.35; outline: none; overflow-wrap: anywhere; cursor: text; }

.ms-end { display: flex; align-items: center; gap: 6px; flex: none; margin-left: auto; }

.bic { display: inline-flex; align-items: baseline; flex: none; width: 70px; }
.bic-text { min-width: 0; flex: 1; font-size: 13px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; outline: none; cursor: text; border-bottom: 1px dashed transparent; color: var(--dim); }
.bic-text:focus { border-bottom-color: var(--faint); text-overflow: clip; color: var(--ink); }
.row-open { width: 24px; height: 24px; border-radius: 6px; color: var(--faint); display: grid; place-items: center; flex: none; }

/* ---------- month calendar (MYCAL) ---------- */
.cal { min-width: 0; }

.chip { display: flex; align-items: center; gap: 5px; width: 100%; min-width: 0; padding: 2px 6px; border-radius: 5px; font-size: 12.5px; line-height: 1.35; text-align: left; color: var(--ink); }

.more { align-self: flex-start; font-size: 12px; font-weight: 700; color: var(--dim); padding: 1px 6px; border-radius: 5px; }
.more:hover { color: var(--ink); background: rgba(255,255,255,.07); }
.cal-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 2px 0; font-size: 12px; color: var(--dim); }

.ck { display: inline-flex; align-items: center; gap: 8px; height: 32px; max-width: 100%; padding: 0 12px 0 10px; border-radius: 999px; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--dim); background: var(--card); border: 1px solid var(--card-edge); transition: background .15s, color .15s, border-color .15s; }

.pop { position: fixed; z-index: 30000; background: var(--pop); border: 1px solid var(--card-edge); border-radius: 10px; padding: 12px; box-shadow: 0 14px 30px rgba(0,0,0,.6); width: 244px; color: var(--ink); }

.status-pop { width: 180px; padding: 6px; display: flex; flex-direction: column; gap: 2px; }

.cal-pop { width: 260px; padding: 10px; }
.cp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }

/* ---------- item details window (MYCAL) ---------- */

.comments:empty { display: none; }

.cmt-t { font-size: 14px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; padding-right: 22px; }

.foot-btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--dim); }

/* day list */
.day { width: min(420px, 100%); background: var(--card); border: 1px solid var(--card-edge); border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.7); padding: 16px 16px 14px 20px; animation: popIn .16s ease; max-height: calc(100vh - 48px); display: flex; flex-direction: column; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 40000; display: flex; align-items: center; gap: 14px; background: #3a3a3d; border-radius: 10px; padding: 10px 12px 10px 16px; box-shadow: 0 10px 28px rgba(0,0,0,.6); font-size: 14px; max-width: calc(100% - 32px); }

<body>

<header class="topbar">
  <div class="brand" id="brand" role="link" tabindex="0" aria-label="PMBridge home">
    <svg class="brand-icon" viewBox="0 0 64 64" aria-hidden="true"><g fill="#3CB371"><rect x="29" y="5" width="6" height="51" rx="1.5"/><rect x="2" y="38" width="60" height="5" rx="1.5"/></g><g stroke="#3CB371" stroke-width="2" stroke-linecap="round"><path d="M32 9L5 38M32 13L13 38M32 17L21 38M32 9L59 38M32 13L51 38M32 17L43 38"/></g></svg>
    <div class="brand-text"><span class="brand-name">PMBridge</span><span class="brand-sub">Projects, Tasks &amp; Dates</span></div>
  </div>
  <div class="top-right">

    <button class="round-btn" id="addBtn" data-pop aria-label="Add" title="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="round-btn" id="moreBtn" data-pop aria-label="Backup and restore" title="Backup and restore"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="18.5" cy="12" r="1.9"/></svg></button>
  </div>

<main id="view"></main>

<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>
<div class="status" id="status"></div>

<script>
(() => {
  "use strict";
  /* ================= basics ================= */
  const COLORS = ["#5AA9FF", "#5FD68A", "#FF7EB6", "#FFA24C", "#B18CFF", "#4FD1C5", "#FF6B6B", "#8C9EFF", "#FFD84D", "#F2F2F2"];
  const PROJECT_COLORS = ["#3CB371", "#5AA9FF", "#FFA24C", "#B18CFF", "#FF7EB6", "#4FD1C5", "#FFD84D", "#8C9EFF", "#FF6B6B"];
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const MON = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  const DOW3 = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  const STATUSES = ["Not Started", "In Progress", "Blocked", "Done"];
  const STATUS_CLASS = { "Not Started": "s-ns", "In Progress": "s-ip", "Blocked": "s-blk", "Done": "s-done" };
  const LS_KEY = "pmbridge-v1";
  const APP_VERSION = "25 (Oct 14)";
  const $ = id => document.getElementById(id);
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const pad2 = n => String(n).padStart(2, "0");
  const iso = d => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  const isIso = s => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
  const parseIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const todayIso = () => iso(new Date());
  const addDays = (s, n) => { const d = parseIso(s); d.setDate(d.getDate() + n); return iso(d); };
  const dayDiff = (a, b) => Math.round((parseIso(b) - parseIso(a)) / 86400000);
  const isPhone = () => matchMedia("(max-width: 699px)").matches;
  const isTouch = () => matchMedia("(hover: none) and (pointer: coarse)").matches;
  const tapOpens = it => isTouch() && !!it.text.trim();
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeColor = (c, f) => (/^#[0-9a-f]{3,8}$/i.test(c || "") ? c : (f || COLORS[0]));
  const normUrl = u => { u = (u || "").trim(); if (!u) return ""; if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = "https://" + u; return u; };
  const safeHref = u => (/^(https?:|mailto:|tel:)/i.test(u || "") ? u : "#");
  const shortDate = s => { const d = parseIso(s); return MON[d.getMonth()] + " " + d.getDate(); };
  const longDate = s => parseIso(s).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric", year: parseIso(s).getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
  const fullDate = s => parseIso(s).toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  const fmtTime = t => { if (!t) return ""; let [h, m] = t.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + ":" + pad2(m) + " " + ap; };
  const shortTime = t => { if (!t) return ""; let [h, m] = t.split(":").map(Number); const ap = h >= 12 ? "p" : "a"; h = h % 12 || 12; return h + (m ? ":" + pad2(m) : "") + ap; };
  const addHour = t => { let [h, m] = t.split(":").map(Number); h = Math.min(23, h + 1); return pad2(h) + ":" + pad2(m); };
  const when = ts => { try { return new Date(ts).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); } catch (e) { return ""; } };
  const meetingName = u => { const s = (u || "").toLowerCase(); if (/teams\.(microsoft|live)\.com/.test(s)) return "Teams"; if (/webex\.com/.test(s)) return "Webex"; if (/zoom\.(us|com)/.test(s)) return "Zoom"; if (/meet\.google\.com/.test(s)) return "Google Meet"; return ""; };
  const I = (d, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const ICON = {
    plus: I('<path d="M12 5v14M5 12h14"/>', 2.2),
    chev: I('<path d="M6 9l6 6 6-6"/>', 2.4),
    back: I('<path d="M15 6l-6 6 6 6"/>', 2.4),
    next: I('<path d="M9 6l6 6-6 6"/>', 2.4),
    check: I('<path d="M5 12.5l4.2 4.2L19 7"/>', 3.4),
    grip: '<svg viewBox="0 0 10 14" fill="currentColor"><circle cx="2.5" cy="2" r="1.4"/><circle cx="7.5" cy="2" r="1.4"/><circle cx="2.5" cy="7" r="1.4"/><circle cx="7.5" cy="7" r="1.4"/><circle cx="2.5" cy="12" r="1.4"/><circle cx="7.5" cy="12" r="1.4"/></svg>',
    indent: I('<path d="M4 6h16M10 12h10M10 18h10M4 10l3 2.5L4 15"/>'),
    task: I('<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 12.5l2.8 2.8L16.5 9"/>'),
    cal: I('<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'),
    folder: I('<path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l2 2.5h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>'),
    pencil: I('<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>'),
    clock: I('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
    palette: I('<path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.2 0 1.8-.9 1.4-1.9-.5-1.2.3-2.6 1.7-2.6H17a3.5 3.5 0 0 0 3.5-3.5c0-5-3.8-9-8.5-9z"/><circle cx="7.8" cy="11" r="1.1" fill="currentColor"/><circle cx="10.5" cy="7.6" r="1.1" fill="currentColor"/><circle cx="14.8" cy="7.8" r="1.1" fill="currentColor"/>'),
    flag: I('<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>'),
    video: I('<rect x="3" y="6.5" width="12.5" height="11" rx="2.5"/><path d="M15.5 10.5l5-3v9l-5-3"/>'),
    link: I('<path d="M10 13.5a4.5 4.5 0 0 0 6.4.4l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2"/><path d="M14 10.5a4.5 4.5 0 0 0-6.4-.4l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/>'),
    notes: I('<path d="M5 3.5h14a1.5 1.5 0 0 1 1.5 1.5v9.5l-6 6H5A1.5 1.5 0 0 1 3.5 19V5A1.5 1.5 0 0 1 5 3.5z"/><path d="M14.5 20.5v-4.5a1.5 1.5 0 0 1 1.5-1.5h4.5M8 8.5h8M8 12.5h5"/>'),
    comment: I('<path d="M20.5 12a8 8 0 0 1-11.6 7.1L3.5 20.5l1.4-4.9A8 8 0 1 1 20.5 12z"/>'),
    trash: I('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>'),
    dup: I('<rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6A2.5 2.5 0 0 0 13 3.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/>'),
    sort: I('<path d="M7 4v16M3.5 16.5L7 20l3.5-3.5M13 6h8M13 11h6M13 16h4"/>'),
    sweep: I('<path d="M4 7l2 2 3.5-3.5M4 15l2 2 3.5-3.5M13 7.5h7M13 15.5h7"/>'),
    up: I('<path d="M12 19V5M6 11l6-6 6 6"/>'),
    down: I('<path d="M12 5v14M6 13l6 6 6-6"/>'),
    open: I('<path d="M9 6l6 6-6 6"/>', 2.4),
    go: I('<path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5"/>', 2.6),
    save: I('<path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/>'),
    load: I('<path d="M12 20V9M7 13.5l5-5 5 5M5 4.5h14"/>'),
    user: I('<circle cx="12" cy="8" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>')
  };

  /* ================= data ================= */
  // state.projects[] -> { id, title, desc, color, cards: [{ id, kind: "task"|"sched", title, color, collapsed, items: [] }] }
  // task item:  { id, text, done, sub, imp }
  // sched item: { id, text, date, end, startTime, endTime, status, prev, bic, color, notes, meeting, links, comments }
  const state = { projects: [] };
  // every task line can carry a date; dated tasks also show on the schedule card and the calendar
  const cleanItem = r => {
    const it = {
      id: r.id || uid(), kind: r.kind === "phase" ? "phase" : "task", text: String(r.text || ""), sub: !!r.sub, imp: !!r.imp,
      date: isIso(r.date) ? r.date : null, end: isIso(r.end) ? r.end : null,

  function renderCal() {

  }

  const sizeNotes = t => { if (!t) return; t.style.height = "auto"; t.style.height = Math.max(74, t.scrollHeight + 2) + "px"; };

  function wireEditor(m) {

    m.addEventListener("click", ev => {

          if (k === "date") { const span = it.date && it.end ? Math.max(0, dayDiff(it.date, it.end)) : 0; it.date = v; it.end = v ? addDays(v, span) : null; }

      const cx = t.closest(".cmt-x"); if (cx) { it.comments = it.comments.filter(x => x.id !== cx.dataset.id); changed(); renderEditor(); return; }

    const from = rows.indexOf(li), startY = e.clientY;
    const mids = rows.map(r => { const b = r.getBoundingClientRect(); return b.top + b.height / 2; });

        <textarea class="field pj-desc" id="pjDesc" placeholder="What work is happening at this campus?">${esc(p.desc)}</textarea>
        <span class="pj-lbl">Color</span>
        <div class="ev-colors">${PROJECT_COLORS.concat(COLORS.filter(c => !PROJECT_COLORS.includes(c))).map(x => `<button class="sw" style="background:${x}" data-c="${x}" aria-label="Color ${x}" aria-pressed="${x.toLowerCase() === p.color.toLowerCase()}"></button>`).join("")}</div>
      </div>
      <div class="ev-foot"><span class="grow"></span><button class="done-btn pj-done">${isNew ? "Create campus" : "Done"}</button></div></div>`;
    document.body.appendChild(m);
    const ta = m.querySelector(".pj-desc"); sizeNotes(ta);
    const finish = open => {
      const t = m.querySelector(".pj-title").value.replace(/\s+/g, " ").trim().toUpperCase();
      p.title = t || (isNew ? "NEW CAMPUS" : p.title); p.desc = ta.value.replace(/\s+$/, "");
      save(p); closeModal();
      if (open) go("#/p/" + p.id); else rerender();
    };
    m.addEventListener("click", e => {
      if (e.target === m || e.target.closest(".ev-x")) return finish(false);
      if (e.target.closest(".pj-done")) return finish(!!isNew);
      const sw = e.target.closest(".sw"); if (sw) { p.color = sw.dataset.c; m.querySelector(".ev").style.setProperty("--c", p.color); m.querySelectorAll(".sw").forEach(x => x.setAttribute("aria-pressed", String(x === sw))); }
    });
    ta.addEventListener("input", () => sizeNotes(ta));
    m.querySelector(".pj-title").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); ta.focus(); } });
    setTimeout(() => { if (!m.contains(document.activeElement)) m.querySelector(".pj-title").focus(); }, 30);
  }
  function startNewProject() { const p = newProject(); renderHome(); openProjectForm(p, true); }

  /* ================= header buttons ================= */
  $("addBtn").addEventListener("click", e => {
    const b = e.currentTarget;
    if (b.classList.contains("open")) { closePops(); return; }
    const p = currentProject();
    if (!p) { closePops(); startNewProject(); return; }
    closePops(); b.classList.add("open");
    const menu = document.createElement("div"); menu.className = "add-menu"; menu.setAttribute("role", "menu");
    menu.innerHTML = `
      <button role="menuitem" data-k="sub"><span class="am-icon" style="color:#5FD68A">${ICON.task}</span><span><strong>Project</strong><small>Its own tasks, critical path and blockers, on this campus's calendar</small></span></button>
      <hr class="am-sep">
      <button role="menuitem" data-k="proj"><span class="am-icon" style="color:#3CB371">${ICON.folder}</span><span><strong>New campus</strong><small>Start another campus card</small></span></button>`;
    menu.addEventListener("click", ev => {
      const k = ev.target.closest("[data-k]"); if (!k) return;
      closePops();
      if (k.dataset.k === "proj") { go("#/"); setTimeout(startNewProject, 0); return; }
      addSub(p);
    });
    placePop(menu, b);
  });
  $("moreBtn").addEventListener("click", e => {
    const b = e.currentTarget;
    if (b.classList.contains("open")) { closePops(); return; }
    b.classList.add("open");
    openEditMenu(b, {
      actions: [
        { icon: ICON.save, text: "Back up my data (download)", run: exportData },
        { icon: ICON.load, text: "Restore from a backup file", run: () => $("importFile").click() },
        { text: "PMBridge version " + APP_VERSION, disabled: true, run: () => {} }
      ]
    });
    b.classList.add("open");
  });
  function exportData() {
    writeNow();
    const blob = new Blob([JSON.stringify({ app: "PMBridge", v: 1, exported: new Date().toISOString(), projects: state.projects }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "pmbridge-backup-" + todayIso() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    showMsg("Backup saved");
  }
  $("importFile").addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!d || !Array.isArray(d.projects)) throw new Error("bad");
      const snap = snapshot();
      state.projects = d.projects.map(cleanProject); writeNow(); go("#/");
      showUndo(`Restored ${state.projects.length} campus${state.projects.length === 1 ? "" : "es"}`, () => restore(snap));
    } catch (err) { showMsg("That file isn't a PMBridge backup."); }
  });

  /* ================= start ================= */
  load();
  route();
  addEventListener("resize", (() => { let w = innerWidth, t; return () => { clearTimeout(t); t = setTimeout(() => { if (innerWidth !== w) { w = innerWidth; renderCal(); } }, 150); }; })());
  // ask the browser to keep this app's data even when storage runs low
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  // works offline and installs as a home-screen app
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
</body>
</html>
